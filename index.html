<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stanseel Pixels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141414; --panel:#1b1b1b; --line:#2b2b2b; --text:#ebe7df; --mute:#85827a;
  --accent:#5cc8a8; --accent2:#f39a5b; --accent3:#f6e05e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:12px/1.45 "JetBrains Mono",ui-monospace,Menlo,monospace}
.app{display:grid;grid-template-columns:310px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand .chips{display:flex}
.brand .chips i{width:14px;height:22px;display:block}
section{border-top:1px solid var(--line);padding:14px 0 6px}
h2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
.row{display:grid;grid-template-columns:86px 1fr 40px;align-items:center;gap:8px;margin:7px 0}
.row.two{grid-template-columns:86px 1fr}
label{color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
input[type=text],input[type=number]{width:100%;background:#121212;border:1px solid var(--line);color:var(--text);
  font:inherit;padding:6px 8px;border-radius:0}
input[type=color]{width:100%;height:28px;border:1px solid var(--line);background:#121212;padding:2px;border-radius:0}
.val{text-align:right;font-variant-numeric:tabular-nums}
button{background:#242424;color:var(--text);border:1px solid var(--line);padding:7px 8px;font:inherit;cursor:pointer;border-radius:0}
button:hover{border-color:#4a4a4a}
button.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
button.primary{background:var(--text);color:#111;border-color:var(--text);font-weight:600}
button.rec{background:var(--accent2);color:#111;border-color:var(--accent2);font-weight:600}
button.rec.busy{background:#c44;border-color:#c44;color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pal{display:flex;height:26px;padding:3px;gap:0;background:var(--pbg)}
.pal span{flex:1}
.pal.on{outline:2px solid var(--text);outline-offset:1px;background:var(--pbg);border-color:var(--line)}
.pal.src span{background:linear-gradient(90deg,#e33,#fc3,#3c6,#39f,#c3f)}
.check{display:flex;align-items:center;gap:8px;color:var(--mute);margin:8px 0;cursor:pointer}
.check input{accent-color:var(--accent)}
.presets{display:flex;gap:4px;margin-top:6px}
.presets button{flex:1;padding:4px 0;font-size:11px}
main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;position:relative;min-height:0;overflow:hidden;
  background-image:radial-gradient(#262626 1px,transparent 1px);background-size:14px 14px}
#out{position:absolute;image-rendering:pixelated;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.5)}
.bar{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;border-top:1px solid var(--line);color:var(--mute);background:var(--panel)}
.bar b{color:var(--text);font-weight:400}
.drop{position:absolute;inset:12px;border:2px dashed var(--accent);display:none;place-items:center;
  background:rgba(20,20,20,.85);font-size:16px;color:var(--accent);z-index:5}
.drop.show{display:grid}
.hint{color:var(--mute);font-size:11px;margin:6px 0 0}
input[type=file]{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  aside{order:2;border-right:0;border-top:1px solid var(--line);padding:16px}
  main{order:1;height:62vh}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><b>stanseel·pixels</b><span class="chips"><i style="background:var(--accent)"></i><i style="background:var(--accent2)"></i><i style="background:var(--accent3)"></i></span></div>

  <section>
    <h2>Source</h2>
    <div class="btns">
      <button class="primary" id="btnUpload">Upload</button>
      <button id="btnCam">Camera</button>
      <button id="btnDemo">Demo</button>
    </div>
    <p class="hint">Image or video. You can also drop a file onto the canvas.</p>
    <input type="file" id="file" accept="image/*,video/*">
  </section>

  <section>
    <h2>Grid</h2>
    <div class="row"><label>Cell size</label><input type="range" data-k="cell" min="3" max="64" step="1" value="14"><span class="val"></span></div>
    <div class="row"><label>Gap</label><input type="range" data-k="gap" min="0" max="8" step="1" value="1"><span class="val"></span></div>
    <div class="row two"><label>Output</label><div class="seg" data-k="res">
      <button data-v="720">720</button><button data-v="1080" class="on">1080</button><button data-v="1440">1440</button><button data-v="2160">4K</button></div></div>
    <div class="row two"><label>Format</label><div class="seg" data-k="aspect">
      <button data-v="src" class="on">Src</button><button data-v="1">1:1</button><button data-v="0.8">4:5</button><button data-v="0.5625">9:16</button><button data-v="1.7778">16:9</button></div></div>
  </section>

  <section>
    <h2>Style</h2>
    <div class="row two"><label>Render</label><div class="seg" data-k="mode">
      <button data-v="glyph" class="on">Tiles</button><button data-v="block">Blocks</button><button data-v="ascii">Text</button><button data-v="dot">Dots</button></div></div>
    <div class="row two"><label>Characters</label><div>
      <input type="text" data-k="chars" value="iqhpb">
      <div class="presets">
        <button data-chars="iqhpb">qhp</button>
        <button data-chars=" .:-=+*#%@">dense</button>
        <button data-chars="░▒▓█">shade</button>
        <button data-chars="01">01</button>
        <button data-chars="+×◇◆">sym</button>
      </div></div></div>
    <div class="row two"><label>Palette</label><div class="pals" id="pals"></div></div>
    <div class="row two"><label>Background</label><input type="color" data-k="bg" value="#1e1e1e"></div>
  </section>

  <section>
    <h2>Tone</h2>
    <div class="row"><label>Threshold</label><input type="range" data-k="thr" min="0" max="0.95" step="0.01" value="0.3"><span class="val"></span></div>
    <div class="row"><label>Contrast</label><input type="range" data-k="contrast" min="0.2" max="3" step="0.05" value="1.3"><span class="val"></span></div>
    <div class="row"><label>Brightness</label><input type="range" data-k="bright" min="-0.6" max="0.6" step="0.01" value="0"><span class="val"></span></div>
    <div class="row"><label>Dither</label><input type="range" data-k="dither" min="0" max="1" step="0.01" value="0.35"><span class="val"></span></div>
    <label class="check"><input type="checkbox" data-k="invert"> Invert</label>
  </section>

  <section>
    <h2>Motion</h2>
    <div class="seg" data-k="anim" style="margin-bottom:6px">
      <button data-v="none">None</button><button data-v="scan" class="on">Build</button><button data-v="flicker">Flicker</button>
      <button data-v="glitch">Glitch</button><button data-v="wave">Wave</button><button data-v="drift">Drift</button></div>
    <div class="row"><label>Speed</label><input type="range" data-k="speed" min="0.1" max="3" step="0.05" value="1"><span class="val"></span></div>
    <div class="row"><label>Intensity</label><input type="range" data-k="amt" min="0" max="1" step="0.01" value="0.6"><span class="val"></span></div>
  </section>

  <section>
    <h2>Export</h2>
    <div class="row two"><label>Length (s)</label><input type="number" id="recLen" min="1" max="120" value="6"></div>
    <div class="btns" style="grid-template-columns:1fr 1fr 1fr">
      <button id="btnPause">Pause</button>
      <button id="btnPng">PNG</button>
      <button class="rec" id="btnRec">Record</button>
    </div>
    <p class="hint" id="recHint">Records the canvas as MP4 or WebM, depending on your browser.</p>
  </section>
</aside>

<main>
  <div class="stage" id="stage">
    <canvas id="out"></canvas>
    <div class="drop" id="drop">Drop image or video</div>
  </div>
  <div class="bar"><span id="info">—</span><span id="fps">—</span></div>
</main>
</div>

<script>
const $ = s => document.querySelector(s);
const out = $('#out'), octx = out.getContext('2d');
const mid = document.createElement('canvas'), mctx = mid.getContext('2d');
const samp = document.createElement('canvas'), sctx = samp.getContext('2d', { willReadFrequently: true });

const PALETTES = {
  signal:   { bg:'#1e1e1e', c:['#5cc8a8','#f39a5b','#f6e05e'] },
  mint:     { bg:'#161817', c:['#1f4a3f','#2f8a70','#5cc8a8','#a6f2d6'] },
  paper:    { bg:'#ece7dc', c:['#c4bdae','#7a7468','#1a1a1a'] },
  thermal:  { bg:'#0b0613', c:['#3a1470','#ab2f75','#ff6a3d','#ffd23f'] },
  lcd:      { bg:'#0f1f0f', c:['#306230','#6b8f1c','#b4d33a'] },
  blueprint:{ bg:'#0b2a5b', c:['#2a5aa8','#7fb0ff','#eef4ff'] },
  mono:     { bg:'#0e0e0e', c:['#3c3c3c','#888888','#d0d0d0','#ffffff'] },
  source:   { bg:'#111111', c:null },
};

const S = {
  cell:14, gap:1, res:1080, aspect:'src', mode:'glyph', chars:'iqhpb', palette:'signal', bg:'#1e1e1e',
  thr:0.3, contrast:1.3, bright:0, dither:0.35, invert:false, anim:'scan', speed:1, amt:0.6,
};

let src = null;           // { el, w, h, kind }
let W = 1080, H = 1080, crop = { sx:0, sy:0, sw:1, sh:1 };
let paused = false, simT = 0, lastNow = performance.now();
let camStream = null;

/* ---------- demo source ---------- */
const demo = document.createElement('canvas'); demo.width = 960; demo.height = 720;
const dctx = demo.getContext('2d');
function drawDemo(t){
  const w = demo.width, h = demo.height;
  dctx.globalCompositeOperation = 'source-over';
  dctx.fillStyle = '#000'; dctx.fillRect(0,0,w,h);
  dctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++){
    const x = w*(0.5+0.38*Math.sin(t*0.45+i*1.7)), y = h*(0.5+0.38*Math.cos(t*0.33+i*2.3));
    const r = 170 + 70*Math.sin(t*0.8+i);
    const g = dctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, `hsla(${i*72 + t*25},85%,60%,0.9)`); g.addColorStop(1,'hsla(0,0%,0%,0)');
    dctx.fillStyle = g; dctx.fillRect(0,0,w,h);
  }
  dctx.globalCompositeOperation = 'source-over';
  dctx.fillStyle = '#fff';
  dctx.font = '900 250px Helvetica, Arial, sans-serif';
  dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
  dctx.fillText('STIJN', w/2 + Math.sin(t*0.7)*40, h/2 + Math.cos(t*0.5)*20);
}
function useDemo(){ stopCam(); src = { el: demo, w: demo.width, h: demo.height, kind:'demo' }; layout(); }

/* ---------- loading sources ---------- */
function loadFile(file){
  if (!file) return;
  const url = URL.createObjectURL(file);
  stopCam();
  if (file.type.startsWith('video')){
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.src = url;
    v.addEventListener('loadeddata', () => {
      src = { el:v, w:v.videoWidth, h:v.videoHeight, kind:'video' };
      $('#recLen').value = Math.max(1, Math.min(120, Math.round(v.duration || 6)));
      layout(); if (!paused) v.play();
    }, { once:true });
  } else {
    const img = new Image();
    img.onload = () => { src = { el:img, w:img.naturalWidth, h:img.naturalHeight, kind:'image' }; layout(); };
    img.src = url;
  }
}
async function useCam(){
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video:{ width:1280, height:720 } });
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.srcObject = camStream;
    await v.play();
    src = { el:v, w:v.videoWidth, h:v.videoHeight, kind:'camera' }; layout();
  } catch (e) { alert('Camera not available: ' + e.message); }
}
function stopCam(){ if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } }

/* ---------- layout ---------- */
function layout(){
  if (!src) return;
  const srcAR = src.w / src.h;
  const ar = S.aspect === 'src' ? srcAR : parseFloat(S.aspect);
  if (ar >= 1){ W = S.res; H = Math.round(S.res / ar); } else { H = S.res; W = Math.round(S.res * ar); }
  out.width = W; out.height = H;
  // cover crop
  if (srcAR > ar){ crop.sh = src.h; crop.sw = src.h * ar; crop.sx = (src.w - crop.sw)/2; crop.sy = 0; }
  else { crop.sw = src.w; crop.sh = src.w / ar; crop.sx = 0; crop.sy = (src.h - crop.sh)/2; }
  fitCanvas();
}
function fitCanvas(){
  const st = $('#stage'), pad = 28;
  const sw = st.clientWidth - pad*2, sh = st.clientHeight - pad*2;
  const k = Math.min(sw / W, sh / H);
  const cw = Math.floor(W*k), ch = Math.floor(H*k);
  out.style.width = cw + 'px'; out.style.height = ch + 'px';
  out.style.left = Math.round((st.clientWidth - cw)/2) + 'px';
  out.style.top = Math.round((st.clientHeight - ch)/2) + 'px';
}
new ResizeObserver(fitCanvas).observe($('#stage'));

/* ---------- helpers ---------- */
function hash(x, y, z){
  let h = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263) ^ Math.imul(z|0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5].map(v => v/16 - 0.47);
const clamp01 = v => v < 0 ? 0 : v > 0.9999 ? 0.9999 : v;

/* ---------- render ---------- */
let fpsAcc = 0, fpsN = 0, fpsT = 0;
function render(now){
  requestAnimationFrame(render);
  const dt = Math.min(0.1, (now - lastNow)/1000); lastNow = now;
  if (!src) return;
  if (!paused) simT += dt * S.speed;
  if (src.kind === 'demo' && !paused) drawDemo(simT);

  const t = simT, A = S.amt;
  const cell = S.cell, gap = Math.min(S.gap, cell - 1), sz = cell - gap;
  const cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);

  // two-step downsample -> area-averaged cell colours, less shimmer on video
  const mw = Math.min(cols*4, Math.round(crop.sw)), mh = Math.min(rows*4, Math.round(crop.sh));
  if (mid.width !== mw || mid.height !== mh){ mid.width = mw; mid.height = mh; }
  if (samp.width !== cols || samp.height !== rows){ samp.width = cols; samp.height = rows; }
  mctx.imageSmoothingQuality = 'high'; sctx.imageSmoothingQuality = 'high';
  try {
    mctx.drawImage(src.el, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, mw, mh);
    sctx.drawImage(mid, 0, 0, cols, rows);
  } catch (e) { return; }
  const d = sctx.getImageData(0, 0, cols, rows).data;

  const pal = PALETTES[S.palette];
  const colors = pal.c;
  const chars = [...(S.chars || ' ')];
  const bg = S.bg;
  octx.fillStyle = bg; octx.fillRect(0, 0, W, H);
  octx.font = `600 ${Math.max(4, Math.round(sz*0.8))}px "JetBrains Mono", ui-monospace, monospace`;
  octx.textAlign = 'center'; octx.textBaseline = 'middle';

  const anim = S.anim;
  // per-frame animation params
  const step = Math.floor(t * 10);
  const cyc = (t * 0.32) % 2.6;            // build: reveal, hold, dissolve, pause
  let thr = S.thr;
  if (anim === 'drift') thr = Math.min(0.98, Math.max(0, S.thr + Math.sin(t*1.2) * 0.35 * A));
  const hiColor = colors ? colors[colors.length - 1] : '#ffffff';
  const levels = colors ? colors.length : 6;

  for (let y = 0; y < rows; y++){
    // glitch: shift whole bands of rows
    let shift = 0;
    if (anim === 'glitch'){
      const band = (y / 3) | 0, gs = Math.floor(t * 8);
      const hr = hash(band, gs, 7);
      if (hr < A * 0.35) shift = Math.round((hash(band, gs, 9) - 0.5) * cols * 0.4 * A);
    }
    for (let x = 0; x < cols; x++){
      const sx = shift ? ((x + shift) % cols + cols) % cols : x;
      const i = (y * cols + sx) * 4;
      const r = d[i], g = d[i+1], b = d[i+2];
      let lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
      lum = (lum - 0.5) * S.contrast + 0.5 + S.bright;
      if (S.invert) lum = 1 - lum;
      if (anim === 'wave') lum += Math.sin(x*0.18 + y*0.11 - t*3.2) * 0.3 * A;
      lum += BAYER[(y & 3) * 4 + (x & 3)] * S.dither * (1 / levels + 0.15);

      if (lum < thr) continue;
      let v = clamp01((lum - thr) / (1 - thr + 1e-6));

      let hot = false, scale = 1;
      if (anim === 'scan'){
        const p = (x / cols) * 0.65 + (1 - y / rows) * 0.35 + (hash(x, y, 3) - 0.5) * 0.25 * A;
        if (cyc < 1){ if (p > cyc * 1.15) continue; hot = p > cyc*1.15 - 0.035; }
        else if (cyc < 1.4){ /* hold full image */ }
        else if (cyc < 2.4){ const c2 = (cyc - 1.4) * 1.15 - 0.05; if (p < c2) continue; hot = p < c2 + 0.035; }
        else continue;
      } else if (anim === 'flicker'){
        const h = hash(x, y, step);
        if (h < A * 0.18) continue;
        if (h > 1 - A * 0.25) { v = clamp01(v + (hash(y, x, step) - 0.5) * 0.8); }
      }

      const px = x * cell + gap/2, py = y * cell + gap/2;
      let col;
      if (hot) col = hiColor;
      else if (colors) col = colors[(v * colors.length) | 0];
      else col = `rgb(${r},${g},${b})`;
      const ch = chars[(v * chars.length) | 0];

      switch (S.mode){
        case 'block':
          octx.fillStyle = col; octx.fillRect(px, py, sz, sz); break;
        case 'dot': {
          const rad = (sz/2) * (0.3 + 0.7 * v) * scale;
          octx.fillStyle = col; octx.beginPath(); octx.arc(px + sz/2, py + sz/2, rad, 0, 6.2832); octx.fill(); break;
        }
        case 'ascii':
          if (ch !== ' '){ octx.fillStyle = col; octx.fillText(ch, px + sz/2, py + sz/2 + 1); } break;
        default: // glyph tile
          octx.fillStyle = col; octx.fillRect(px, py, sz, sz);
          if (ch !== ' ' && sz >= 6){ octx.fillStyle = bg; octx.fillText(ch, px + sz/2, py + sz/2 + 1); }
      }
    }
  }

  // stats
  fpsAcc += dt; fpsN++;
  if (now - fpsT > 500){
    $('#fps').textContent = Math.round(fpsN / fpsAcc) + ' fps';
    $('#info').innerHTML = `<b>${cols} × ${rows}</b> cells · <b>${W} × ${H}</b> px · ${src.kind}`;
    fpsAcc = 0; fpsN = 0; fpsT = now;
  }
}

/* ---------- UI binding ---------- */
function showVal(inp){
  const span = inp.parentElement.querySelector('.val');
  if (span) span.textContent = (+inp.value).toFixed(inp.step && inp.step.includes('.') ? 2 : 0);
}
document.querySelectorAll('[data-k]').forEach(el => {
  const k = el.dataset.k;
  if (el.classList.contains('seg')){
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      const v = b.dataset.v;
      S[k] = (k === 'res') ? +v : v;
      if (k === 'res' || k === 'aspect') layout();
    });
    return;
  }
  const upd = () => {
    if (el.type === 'checkbox') S[k] = el.checked;
    else if (el.type === 'range') { S[k] = +el.value; showVal(el); }
    else S[k] = el.value;
  };
  el.addEventListener('input', upd); upd();
});
document.querySelectorAll('[data-chars]').forEach(b => b.addEventListener('click', () => {
  const inp = document.querySelector('[data-k=chars]'); inp.value = b.dataset.chars; S.chars = b.dataset.chars;
}));

// palettes
const palWrap = $('#pals');
Object.entries(PALETTES).forEach(([name, p]) => {
  const b = document.createElement('button');
  b.className = 'pal' + (name === S.palette ? ' on' : '') + (p.c ? '' : ' src');
  b.title = name; b.style.setProperty('--pbg', p.bg);
  b.innerHTML = p.c ? p.c.map(c => `<span style="background:${c}"></span>`).join('') : '<span></span>';
  b.addEventListener('click', () => {
    S.palette = name; S.bg = p.bg; document.querySelector('[data-k=bg]').value = p.bg;
    palWrap.querySelectorAll('.pal').forEach(x => x.classList.toggle('on', x === b));
  });
  palWrap.appendChild(b);
});

// source buttons
$('#btnUpload').onclick = () => $('#file').click();
$('#file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
$('#btnDemo').onclick = useDemo;
$('#btnCam').onclick = useCam;

// drag & drop
const stage = $('#stage'), drop = $('#drop');
['dragenter','dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('show'); }));
['dragleave','drop'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || e.target === drop) drop.classList.remove('show'); }));
stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

// pause
$('#btnPause').onclick = () => {
  paused = !paused;
  $('#btnPause').textContent = paused ? 'Play' : 'Pause';
  $('#btnPause').classList.toggle('on', paused);
  if (src && src.kind === 'video') paused ? src.el.pause() : src.el.play();
};

// export PNG
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const stamp = () => new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
$('#btnPng').onclick = () => out.toBlob(b => download(b, `stanseel-pixels-${stamp()}.png`), 'image/png');

// record
let rec = null;
$('#btnRec').onclick = () => {
  if (rec){ rec.stop(); return; }
  if (!window.MediaRecorder){ alert('Recording is not supported in this browser.'); return; }
  const mime = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const stream = out.captureStream(30);
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const btn = $('#btnRec'), hint = $('#recHint');
  rec.onstop = () => {
    clearInterval(timer); clearTimeout(stopper);
    download(new Blob(chunks, { type: mime }), `stanseel-pixels-${stamp()}.${mime.includes('mp4') ? 'mp4' : 'webm'}`);
    btn.textContent = 'Record'; btn.classList.remove('busy');
    hint.textContent = 'Saved. Records the canvas as MP4 or WebM, depending on your browser.';
    rec = null;
  };
  if (paused) $('#btnPause').click();
  if (src && src.kind === 'video'){ src.el.currentTime = 0; src.el.play(); }
  simT = 0;
  const secs = Math.max(1, +$('#recLen').value || 6);
  rec.start(250);
  const t0 = performance.now();
  btn.classList.add('busy');
  const tick = () => { const left = Math.max(0, secs - (performance.now() - t0)/1000); btn.textContent = 'Stop ' + left.toFixed(0) + 's'; hint.textContent = 'Recording…'; };
  tick(); const timer = setInterval(tick, 200);
  const stopper = setTimeout(() => rec && rec.stop(), secs * 1000);
};

useDemo();
requestAnimationFrame(render);
</script>
</body>
</html>
